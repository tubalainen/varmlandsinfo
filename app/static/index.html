<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evenemang i Värmland</title>
<link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1d6f42">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="toprow">
      <h1><img class="logo" src="/static/icons/icon.svg" alt="" width="40" height="40">Evenemang i Värmland</h1>
      <div class="actions">
        <button id="refresh" type="button" class="btn-light">⟳ Uppdatera evenemang</button>
        <button id="chat-open" type="button" class="btn-light">💬 Fråga AI</button>
      </div>
    </div>
    <p id="status" class="muted">Hämtar evenemang …</p>
  </div>
</header>

<main class="wrap">
  <section class="filters" aria-label="Filter">
    <div class="viewtoggle" role="group" aria-label="Visning">
      <button type="button" data-view="list">☰ Lista</button>
      <button type="button" data-view="calendar">📅 Kalender</button>
    </div>
    <input id="q" type="search" placeholder="Sök titel, plats, arrangör …" autocomplete="off">
    <select id="municipality"><option value="">Alla kommuner</option></select>
    <select id="source"><option value="">Alla källor</option></select>
    <label class="list-only">Från <input id="from" type="date"></label>
    <label class="list-only">Till <input id="to" type="date"></label>
    <label class="check list-only"><input id="expand" type="checkbox"> Visa varje tillfälle</label>
    <button id="reset" type="button">Rensa</button>
  </section>

  <section id="cats" class="cats" aria-label="Evenemangstyper"></section>
  <p id="count" class="muted"></p>
  <section id="list"></section>
  <section id="calendar" class="calendar" hidden aria-label="Kalender"></section>
</main>

<dialog id="daydialog" class="daydialog">
  <header><h2></h2><form method="dialog"><button aria-label="Stäng">✕</button></form></header>
  <div class="daylist"></div>
</dialog>

<dialog id="lightbox"><img alt=""><p class="muted"></p><form method="dialog"><button>Stäng</button></form></dialog>

<aside id="chat" class="chat" hidden aria-label="AI-chatt">
  <header class="chat-head">
    <strong>Fråga AI om evenemangen</strong>
    <span id="chat-model" class="muted"></span>
    <button id="chat-clear" type="button" title="Rensa samtalet">Rensa</button>
    <button id="chat-close" type="button" aria-label="Stäng">✕</button>
  </header>
  <div id="chat-log" class="chat-log">
    <div class="msg assistant intro">Hej! Fråga mig om evenemang i Värmland, till exempel:
      <ul>
        <li><a href="#" class="ex">Vad händer i Karlstad i helgen?</a></li>
        <li><a href="#" class="ex">Finns det några barnaktiviteter nästa vecka?</a></li>
        <li><a href="#" class="ex">Vilka konserter finns i oktober?</a></li>
      </ul>
    </div>
  </div>
  <form id="chat-form" class="chat-form">
    <textarea id="chat-input" rows="2" placeholder="Skriv en fråga …" required></textarea>
    <button type="submit">Skicka</button>
  </form>
</aside>

<footer class="wrap muted">Källor: <span id="sources"></span> · <a href="https://github.com/tubalainen/varmlandsinfo" target="_blank" rel="noopener">Värmlandsinfo</a> <span id="version"></span></footer>
<script src="/static/app.js"></script>
<script src="/static/calendar.js"></script>
<script src="/static/chat.js"></script>
</body>
</html>
