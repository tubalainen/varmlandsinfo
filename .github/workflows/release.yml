name: Release

# En release skapas antingen genom att pusha en tagg (git tag v0.0.1 && git push origin v0.0.1)
# eller genom att köra flödet manuellt med ett versionsnummer (då skapas taggen på main).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version utan v-prefix, t.ex. 0.0.1"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}

      - name: Bestäm version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Ogiltigt versionsnummer: $VERSION"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Kontrollera versionsfil och CHANGELOG
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          FILE_VERSION=$(python3 -c "import re;print(re.search(r'\"(.+)\"', open('app/version.py').read())[1])")
          if [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "::error::app/version.py har $FILE_VERSION men releasen är $VERSION"; exit 1
          fi
          # Ta ut avsnittet för versionen ur CHANGELOG.md som release notes
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md saknar ett avsnitt för [$VERSION]"; exit 1
          fi
          cat notes.md

      - name: Skapa GitHub-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file notes.md \
            --generate-notes \
            --target "$(git rev-parse HEAD)"

  docker:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
