services:
  varmlandsinfo:
    image: ghcr.io/tubalainen/varmlandsinfo:latest
    build: .
    container_name: varmlandsinfo
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Europe/Stockholm
      # Hur ofta evenemangen hämtas på nytt från Visit Värmland (minuter)
      REFRESH_MINUTES: "60"
