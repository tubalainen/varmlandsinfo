services:
  varmlandsinfo:
    image: ghcr.io/tubalainen/varmlandsinfo:${VARMLANDSINFO_TAG:-latest}
    build: .
    container_name: varmlandsinfo
    restart: unless-stopped
    ports:
      - "${VARMLANDSINFO_PORT:-7799}:8080"
    # Gör det möjligt att nå en Ollama som körs direkt på värdmaskinen
    # via http://host.docker.internal:11434
    # Hämtad data sparas på värden så att den överlever omstarter och uppgraderingar
    volumes:
      - ${VARMLANDSINFO_DATA:-./data}:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Värden nedan kan sättas i en .env-fil bredvid denna fil (se .env.example)
    environment:
      TZ: ${TZ:-Europe/Stockholm}
      # Ägare till filerna i datakatalogen på värden (kör `id` för att se dina värden)
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      DAILY_REFRESH_TIME: ${DAILY_REFRESH_TIME:-05:00}
      REFRESH_MINUTES: ${REFRESH_MINUTES:-0}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
      TICKETMASTER_RADIUS_KM: ${TICKETMASTER_RADIUS_KM:-150}
      SHL_TEAM_CODE: ${SHL_TEAM_CODE:-FBK}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      CHAT_MAX_EVENTS: ${CHAT_MAX_EVENTS:-40}
      SEARXNG_URL: ${SEARXNG_URL:-}
      SEARXNG_RESULTS: ${SEARXNG_RESULTS:-5}
      SEARXNG_LANGUAGE: ${SEARXNG_LANGUAGE:-sv}
